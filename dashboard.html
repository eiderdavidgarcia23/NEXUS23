<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS23 · Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dashboard-body-tag">
  <div class="app-shell">

    <aside class="sidebar" id="sidebar">
      <button class="sidebar-brand" id="brandHome"><span class="brand-white">NEXUS</span><span class="brand-accent">23</span></button>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-section="inicio">
          <span class="nav-icon">◧</span> Inicio
        </button>
        <button class="nav-item" data-section="admin" id="navAdmin" hidden>
          <span class="nav-icon">⚙</span> Administración
        </button>
        <button class="nav-item" data-section="todas" id="navTodas" hidden>
          <span class="nav-icon">▤</span> Todas las plataformas
        </button>
        <button class="nav-item" data-section="cuenta">
          <span class="nav-icon">◔</span> Cuenta
        </button>
      </nav>

      <button class="sidebar-logout" id="logoutBtn">Cerrar sesión</button>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main-area">
      <header class="topbar">
        <button class="hamburger" id="hamburgerBtn" aria-label="Abrir menú">☰</button>
        <span id="userLabel" class="user-label"></span>
      </header>

      <main class="content">

        <section class="view" id="view-inicio">
          <p class="section-label">Tus plataformas</p>
          <div class="cards-grid" id="platformsGrid"></div>
          <button class="add-platform-btn" id="addMyPlatformBtn">+ Agregar plataforma</button>
        </section>

        <section class="view" id="view-admin" hidden>
          <p class="section-label">Usuarios pendientes</p>
          <div class="pending-list" id="pendingList">
            <p class="empty-msg" id="pendingEmptyMsg">No hay usuarios pendientes.</p>
          </div>

          <p class="section-label section-label-spaced">Todos los usuarios</p>
          <div class="admin-users-list" id="adminUsersList"></div>
          <button class="add-platform-btn" id="addUserBtn">+ Crear usuario</button>

          <p class="section-label section-label-spaced">Plataformas globales</p>
          <div class="admin-platforms-list" id="adminPlatformsList"></div>
          <button class="add-platform-btn" id="addPlatformBtn">+ Agregar plataforma</button>

          <p class="section-label section-label-spaced">Asignar plataformas a usuarios</p>
          <div class="modal-field assign-user-field">
            <label for="asignarUsuarioSelect">Usuario</label>
            <select id="asignarUsuarioSelect"></select>
          </div>
          <div class="admin-platforms-list" id="asignarPlataformasList"></div>
        </section>

        <section class="view" id="view-todas" hidden>
          <p class="section-label">Plataformas globales (admin)</p>
          <div class="todas-grid" id="todasGlobalesList"></div>

          <p class="section-label section-label-spaced">Plataformas propias de cada usuario</p>
          <div id="todasPorUsuario"></div>
        </section>

        <section class="view" id="view-cuenta" hidden>
          <p class="section-label">Tu cuenta</p>
          <div class="account-card">
            <div class="account-row">
              <span class="account-label">Usuario</span>
              <span class="account-value" id="cuentaUsuario"></span>
            </div>
            <div class="account-row">
              <span class="account-label">Rol</span>
              <span class="account-value" id="cuentaRol"></span>
            </div>
            <div class="account-row">
              <span class="account-label">Estado</span>
              <span class="account-value" id="cuentaEstado"></span>
            </div>
          </div>
        </section>

      </main>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <h3 class="modal-title" id="modalTitle"></h3>
      <div class="modal-fields" id="modalFields"></div>
      <p class="modal-error" id="modalError"></p>
      <div class="modal-actions">
        <button class="modal-btn-cancel" id="modalCancelBtn">Cancelar</button>
        <button class="modal-btn-accept" id="modalAcceptBtn">Aceptar</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
