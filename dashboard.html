<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS23 · Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="flex-direction: column;">
  <div class="dashboard-header">
    <h2><span class="brand-white">NEXUS</span><span class="brand-accent">23</span></h2>
    <div>
      <span id="userLabel" style="margin-right: 16px; color: #8b949e; font-size: 13px;"></span>
      <button class="logout-btn" id="logoutBtn">Cerrar sesión</button>
    </div>
  </div>

  <div class="dashboard-body">
    <p class="section-label">Tus plataformas</p>
    <div class="cards-grid">

      <div class="platform-card">
        <h3>COOPMOCUR</h3>
        <p>Sistema de inventario y gestión para la cooperativa de motocarros.</p>
        <div class="platform-status">
          <span class="status-dot status-checking" id="dotCoopmocur"></span>
          <span id="statusCoopmocur">Verificando...</span>
        </div>
        <a href="https://eiderdavidgarcia23.github.io/coopmocur-system/" target="_blank" class="open-btn">Abrir plataforma →</a>
      </div>

      <div class="platform-card">
        <h3>Jarvis</h3>
        <p>Asistente personal con IA, búsqueda web y voz.</p>
        <div class="platform-status">
          <span class="status-dot status-checking" id="dotJarvis"></span>
          <span id="statusJarvis">Verificando...</span>
        </div>
        <a href="https://jarvis-ne7h.onrender.com" target="_blank" class="open-btn">Abrir plataforma →</a>
      </div>

    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
