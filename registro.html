<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS23 · Crear cuenta</title>
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1><span class="brand-white">NEXUS</span><span class="brand-accent">23</span></h1>
      <p class="subtitle">Crea tu cuenta</p>

      <form id="registroForm">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" placeholder="tu usuario" required>

        <label for="password">Contraseña</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="mínimo 6 caracteres" required>
          <span id="togglePassword" class="toggle-eye">👁</span>
        </div>

        <label for="password2">Confirmar contraseña</label>
        <input type="password" id="password2" placeholder="••••••••" required>

        <button type="submit" id="loginBtn">Crear cuenta</button>
        <p id="errorMsg" class="error-msg"></p>
        <p id="successMsg" class="success-msg"></p>
      </form>

      <p class="signup-link">¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="registro.js"></script>
</body>
</html>
