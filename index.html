<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS23</title>
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1><span class="brand-white">NEXUS</span><span class="brand-accent">23</span></h1>
      <p class="subtitle">Accede a tu centro de comando</p>

      <form id="loginForm">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" placeholder="tu usuario" required>

        <label for="password">Contraseña</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="••••••••" required>
          <span id="togglePassword" class="toggle-eye">👁</span>
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="remember">
          <label for="remember">Recuérdame</label>
        </div>

        <button type="submit" id="loginBtn">Ingresar</button>
        <p id="errorMsg" class="error-msg"></p>
      </form>

      <p class="signup-link">¿No tienes cuenta? <a href="registro.html">Créala aquí</a></p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
