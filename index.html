<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS23</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1><span class="brand-white">NEXUS</span><span class="brand-accent">23</span></h1>
      <p class="subtitle" id="cardSubtitle">Accede a tu centro de comando</p>

      <form id="loginForm">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" placeholder="tu usuario" required>

        <label for="password">Contraseña</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="••••••••" required>
          <span class="toggle-eye" data-target="password">👁</span>
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="remember">
          <label for="remember">Recuérdame</label>
        </div>

        <button type="submit" id="loginBtn">Ingresar</button>
        <p id="errorMsg" class="error-msg"></p>
      </form>

      <form id="registerForm" class="hidden-form">
        <label for="regUsuario">Usuario</label>
        <input type="text" id="regUsuario" placeholder="elige un usuario" required>

        <label for="regPassword">Contraseña</label>
        <div class="password-wrapper">
          <input type="password" id="regPassword" placeholder="••••••••" required>
          <span class="toggle-eye" data-target="regPassword">👁</span>
        </div>

        <label for="regPassword2">Confirmar contraseña</label>
        <div class="password-wrapper">
          <input type="password" id="regPassword2" placeholder="••••••••" required>
          <span class="toggle-eye" data-target="regPassword2">👁</span>
        </div>

        <button type="submit" id="registerBtn">Crear cuenta</button>
        <p id="regMsg" class="error-msg"></p>
      </form>

      <p class="switch-form">
        <span id="toLoginText" class="hidden-form">¿Ya tienes cuenta? <a href="#" id="showLogin">Inicia sesión</a></span>
        <span id="toRegisterText">¿No tienes cuenta? <a href="#" id="showRegister">Regístrate</a></span>
      </p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
